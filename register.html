<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORA // REGISTER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-grid"></div><div class="vignette"></div>
    <div class="container">
        <div style="text-align:center; margin-bottom:20px;">
            <img src="/static/logo.png" style="width: 60px;">
            <h1 style="font-size: 2.5rem; margin: 10px 0;">NEW UPLINK</h1>
            <small style="color:var(--neon-pink); letter-spacing:4px;">CREATE OPERATOR ID</small>
        </div>
        <div class="card">
            <input type="text" id="name" placeholder="FULL DESIGNATION" autocomplete="off">
            <input type="email" id="email" placeholder="EMAIL FREQUENCY" autocomplete="off">
            <input type="text" id="phone" placeholder="COMMS NUMBER" autocomplete="off">
            <input type="text" id="username" placeholder="SET OPERATOR ID" autocomplete="off">
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="SET SECURITY KEY">
                <button class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" type="button"><i class="fa-solid fa-eye"></i></button>
            </div>
            <div class="btn-group">
                <button onclick="doRegister()" class="btn-primary">CONFIRM</button>
                <button onclick="window.location.href='/login'" class="btn-danger">ABORT</button>
            </div>
            <p id="error" class="error" style="min-height: 20px; color: #ff003c; margin-top: 15px; text-align: center;"></p>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
