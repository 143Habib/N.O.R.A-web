<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NORA // HOST OVERLORD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        /* Admin Specific Overrides */
        .monitor-feed-container {
            background-color: #000;
            display: flex;
            flex-direction: column;
            flex: 1;
            position: relative;
            overflow: hidden;
            border-left: 1px solid rgba(255, 0, 60, 0.3);
        }

        .monitor-feed { 
            flex: 1;
            font-family: 'Courier New', monospace; 
            padding: 20px; 
            overflow-y: auto; 
            background: radial-gradient(circle at center, #110000 0%, #000000 100%);
            box-shadow: inset 0 0 50px rgba(255, 0, 60, 0.1);
        }

        .log-entry { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; animation: slideIn 0.2s; }
        .log-user { color: var(--neon-cyan); font-weight: bold; }
        .log-ai { color: var(--neon-pink); font-weight: bold; }
        .log-meta { color: #666; font-size: 0.8rem; float: right; }
        
        .user-card {
            padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 10px;
        }
        .user-card:hover { background: rgba(255, 0, 60, 0.1); border-left: 3px solid var(--neon-red); }
        .blink { animation: blink 1s infinite; color: var(--neon-red); }
        
        /* Red theme for Admin Header */
        .admin-header { border-bottom: 1px solid var(--neon-red) !important; }
        .admin-title { color: var(--neon-red) !important; text-shadow: 0 0 10px var(--neon-red); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <!-- Use app-layout to get the flexbox behavior for sliding -->
    <div class="app-layout">
        
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="brand" style="border-bottom: 1px solid var(--neon-red);">
                <h2 style="color: var(--neon-red);">GOD MODE</h2>
                <small style="color: #666;">NETWORK OVERLORD</small>
            </div>
            
            <div style="padding: 15px; color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">
                <i class="fa-solid fa-users-viewfinder"></i> Active Agents
            </div>
            
            <div id="userList" class="session-list">
                {% for u in users %}
                <div class="user-card">
                    <i class="fa-solid fa-user-astronaut" style="color: #666;"></i>
                    <div>
                        <strong style="color: #fff;">{{ u.username }}</strong><br>
                        <small style="color: #888;">{{ u.name }}</small>
                    </div>
                </div>
                {% endfor %}
            </div>

            <div style="padding: 15px; margin-top: auto;">
                <button onclick="window.location.href='/logout'" class="btn-danger" style="width:100%">
                    <i class="fa-solid fa-power-off"></i> TERMINATE
                </button>
            </div>
        </aside>

        <!-- MAIN MONITORING AREA -->
        <main class="monitor-feed-container">
            
            <!-- HEADER (With Toggle Button) -->
            <div class="chat-header admin-header">
                <button class="toggle-btn" onclick="toggleSidebar()">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="chat-title-group">
                    <h3 class="admin-title">GLOBAL SURVEILLANCE</h3>
                </div>
                <div style="font-family: 'Orbitron'; color: var(--neon-red); font-size: 0.9rem;">
                    <span class="blink">● LIVE FEED</span>
                </div>
            </div>

            <!-- LOGS -->
            <div id="globalLog" class="monitor-feed">
                <div style="text-align: center; color: #444; margin-bottom: 20px; margin-top: 50px;">
                    <i class="fa-solid fa-satellite-dish" style="font-size: 3rem; margin-bottom: 10px;"></i><br>
                    WAITING FOR NETWORK TRAFFIC...
                </div>
                <!-- Logs appear here via JS -->
            </div>
        </main>
    </div>

    <!-- ADMIN JS -->
    <script>
        const socket = io();
        function toggleSidebar() { 
            document.getElementById('sidebar').classList.toggle('closed'); 
        }

        socket.on('connect', () => {
            console.log("Admin Connected to Monitoring Stream");
            addLog({username: "SYSTEM"}, "admin", "Uplink established. Monitoring started.", null);
        });

        socket.on('admin_feed_update', (data) => {
            const userObj = { username: data.user }; 
            addLog(userObj, data.role, data.content, data.timestamp);
        });

        function addLog(user, role, content, time) {
            const feed = document.getElementById('globalLog');
            
            // Remove "Waiting" text if it exists
            if(feed.innerText.includes("WAITING FOR NETWORK")) feed.innerHTML = '';

            let colorClass = role === 'user' ? 'log-user' : 'log-ai';
            let icon = role === 'user' ? '<i class="fa-solid fa-mobile-screen"></i>' : '<i class="fa-solid fa-microchip"></i>';
            let senderName = role === 'user' ? user.username.toUpperCase() : "N.O.R.A (AI)";
            let align = role === 'user' ? 'left' : 'left'; // Keep all logs aligned left for readability
            let bg = role === 'user' ? 'rgba(0, 243, 255, 0.05)' : 'rgba(188, 19, 254, 0.05)';

            // Formatting special content
            if(content.includes('[WEB SEARCH]')) content = `<span style="color: #f1c40f;">${content}</span>`;
            if(content.includes('[Attached:')) content = `<span style="color: #3498db;">${content}</span>`;

            const html = `
                <div class="log-entry" style="background: ${bg}; padding: 10px; border-left: 3px solid ${role === 'user' ? 'var(--neon-cyan)' : 'var(--neon-pink)'};">
                    <div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
                        <span class="${colorClass}">${icon} ${senderName}</span>
                        <span class="log-meta">${time || new Date().toLocaleTimeString()}</span>
                    </div>
                    <div style="color: #e0e0e0; font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; white-space: pre-wrap;">${content}</div>
                </div>
            `;
            
            feed.insertAdjacentHTML('afterbegin', html); // Newest at top
        }
    </script>
    <script src="/static/script.js"></script> 
</body>
</html>
