<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NORA // HOST OVERLORD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        .admin-layout { display: grid; grid-template-columns: 250px 1fr; height: 100vh; gap: 2px; }
        .monitor-feed { 
            background: #000; 
            font-family: 'Courier New', monospace; 
            padding: 20px; 
            overflow-y: auto; 
            border: 1px solid var(--neon-red);
            box-shadow: inset 0 0 50px rgba(255, 0, 60, 0.1);
        }
        .log-entry { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; animation: slideIn 0.2s; }
        .log-user { color: var(--neon-cyan); font-weight: bold; }
        .log-ai { color: var(--neon-pink); font-weight: bold; }
        .log-meta { color: #666; font-size: 0.8rem; float: right; }
        .user-card {
            padding: 15px; border-bottom: 1px solid #333; cursor: pointer;
            transition: 0.3s;
        }
        .user-card:hover { background: rgba(255,255,255,0.1); }
        .blink { animation: blink 1s infinite; color: red; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="admin-layout">
        <!-- Sidebar: Active Users -->
        <aside class="sidebar">
            <div class="brand">
                <h2 style="color: var(--neon-red);">GOD MODE</h2>
                <small>NETWORK MONITORING</small>
            </div>
            <div style="padding: 10px; color: #888; font-size: 0.9rem;">REGISTERED AGENTS:</div>
            <div id="userList">
                {% for u in users %}
                <div class="user-card">
                    <i class="fa-solid fa-user"></i> <strong>{{ u.username }}</strong><br>
                    <small>{{ u.name }}</small>
                </div>
                {% endfor %}
            </div>
            <div style="margin-top: auto; padding: 20px;">
                <button onclick="window.location.href='/logout'" class="btn-danger" style="width:100%">TERMINATE UPLINK</button>
            </div>
        </aside>

        <!-- Main: Global Log -->
        <main class="monitor-feed" id="globalLog">
            <div style="text-align: center; color: var(--neon-red); margin-bottom: 20px;">
                --- STARTING GLOBAL SURVEILLANCE FEED ---<br>
                <span class="blink">● LIVE</span>
            </div>
            <!-- Logs appear here -->
        </main>
    </div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            console.log("Admin Connected to Monitoring Stream");
            addLog("SYSTEM", "CORE", "Connection established. Listening for network traffic...");
        });

        // Listen for ANY traffic from ANY user
        socket.on('admin_feed_update', (data) => {
            addLog(data.user, data.role, data.content, data.timestamp);
        });

        function addLog(user, role, content, time) {
            const feed = document.getElementById('globalLog');
            
            let colorClass = role === 'user' ? 'log-user' : 'log-ai';
            let icon = role === 'user' ? '<i class="fa-solid fa-terminal"></i>' : '<i class="fa-solid fa-robot"></i>';
            let senderName = role === 'user' ? user.toUpperCase() : "N.O.R.A";

            // If it's a command, highlight it
            if(content.includes('[WEB SEARCH]')) content = `<span style="color:yellow">${content}</span>`;
            if(content.includes('open')) content = `<span style="color:var(--neon-green)">${content}</span>`;

            const html = `
                <div class="log-entry">
                    <span class="log-meta">${time || new Date().toLocaleTimeString()}</span>
                    <div class="${colorClass}">
                        ${icon} ${senderName}
                    </div>
                    <div style="color: #ddd; margin-top: 5px; white-space: pre-wrap;">${content}</div>
                </div>
            `;
            
            feed.insertAdjacentHTML('afterbegin', html); // Newest on top
        }
    </script>
</body>
</html>
