<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORA // ACCESS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-grid"></div><div class="vignette"></div>
    <div id="splash-screen">
        <div class="logo-container" onclick="unlockSystem()">
            <img src="/static/logo.png" alt="NORA Logo" class="logo-img">
        </div>
        <div class="click-hint">[ Click the CORE ]</div>
    </div>
    <div class="login-wrapper">
        <div class="container">
            <div style="text-align:center; margin-bottom:20px;">
                <img src="/static/logo.png" style="width: 100px;">
                <h1 style="font-size: 3.5rem; margin: 10px 0;">N.O.R.A</h1>
                <small style="color:var(--neon-cyan); letter-spacing:3px;">NEURAL OPERATIONS</small>
            </div>
            <div class="card">
               
                <input type="text" id="username" placeholder="OPERATOR ID">
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="ACCESS KEY">
                    <button class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" type="button"><i class="fa-solid fa-eye"></i></button>
                </div>
                <div class="btn-group">
                    <button onclick="doLogin()" class="btn-primary">INITIALIZE</button>
                    <button onclick="window.location.href='/register'" class="btn-secondary">REGISTER</button>
                </div>
                <p id="error" class="error" style="min-height:20px; color: #ff003c; margin-top:15px; text-align:center;"></p>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
